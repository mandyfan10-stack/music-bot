name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/utils.js
      - run: node --check server.js
      - run: npm run build:css
      - run: git diff --exit-code -- src/tailwind.css

  supabase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.1
      - name: Verify Supabase layout
        shell: bash
        run: |
          test -f supabase/config.toml
          test -f supabase/schema.sql
          test -f supabase/functions/auth/index.ts
          test -f supabase/functions/release-cover/index.ts
          test -f supabase/functions/parse-link/index.ts
          test -f supabase/functions/send-notifications/index.ts
          test -f supabase/functions/share-message/index.ts
      - run: deno check --frozen supabase/functions/*/index.ts
      - run: deno fmt --check supabase/functions
      - run: deno test --frozen supabase/functions/_shared/*_test.ts
  supabase-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - run: supabase db start
      - run: supabase test db
